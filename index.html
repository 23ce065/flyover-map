<!DOCTYPE html>
<html>
<head>
  <title>G.D. Naidu Flyover Spatial Mapping</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="leaflet.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #map {
      height: 100vh;
      width: 100%;
      background: #e5e3df;
    }

    .legend {
      background: white;
      padding: 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
    }

    .legend i {
      width: 14px;
      height: 14px;
      float: left;
      margin-right: 8px;
      border-radius: 50%;
    }

    .legend .line {
      height: 4px;
      border-radius: 0;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="leaflet.js"></script>

<script>

  // ==========================================
  // 1. INITIALIZE MAP
  // ==========================================

  var map = L.map('map').setView(
    [11.020, 77.000],
    13
  );


  // ==========================================
  // 2. OPENSTREETMAP BASE MAP
  // ==========================================

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }
  ).addTo(map);


  // ==========================================
// 3. Display ONLY the actual G.D. Naidu Flyover
// from the original data.geojson

var flyoverLayer = L.geoJSON(corridorData, {

    filter: function(feature) {

        var p = feature.properties || {};

        var name = String(
            p.name ||
            p["bridge:name"] ||
            p.alt_name ||
            ""
        ).toLowerCase();

        return (
            name.includes("naidu flyover") ||
            name.includes("g. d. naidu flyover") ||
            name.includes("gd naidu flyover")
        );
    },

    style: function(feature) {

        return {
            color: "#FF0000",
            weight: 7,
            opacity: 1
        };

    },

    onEachFeature: function(feature, layer) {

        layer.bindPopup(
            "<b>G.D. Naidu Flyover</b><br>" +
            "Actual mapped flyover segment"
        );

    }

}).addTo(map);


// Zoom to the complete actual flyover
if (flyoverLayer.getBounds().isValid()) {

    map.fitBounds(
        flyoverLayer.getBounds(),
        {
            padding: [30, 30]
        }
    );

}

      alert(
        'G.D. Naidu Flyover GeoJSON could not be loaded.'
      );

    });


  // ==========================================
  // 4. LOAD SURVEY LOCATIONS
  // ==========================================

  fetch('survey_locations.geojson')

    .then(function(response) {

      if (!response.ok) {
        throw new Error(
          'Could not load survey_locations.geojson'
        );
      }

      return response.json();

    })

    .then(function(surveyData) {

      var surveyLayer = L.geoJSON(
        surveyData,
        {

          // ------------------------------
          // Survey point appearance
          // ------------------------------

          pointToLayer:
            function(feature, latlng) {

              var p =
                feature.properties || {};

              var city =
                Number(
                  p.total_vehicles_day_towards_city ||
                  0
                );

              var goldwins =
                Number(
                  p.total_vehicles_day_towards_goldwins ||
                  0
                );

              var total =
                city + goldwins;

              var radius = 9;

              if (total >= 120000) {
                radius = 16;
              }
              else if (total >= 80000) {
                radius = 13;
              }
              else if (total >= 50000) {
                radius = 10;
              }

              return L.circleMarker(
                latlng,
                {
                  radius: radius,
                  fillColor: '#FF6600',
                  color: '#FFFFFF',
                  weight: 2,
                  opacity: 1,
                  fillOpacity: 0.9
                }
              );

            },


          // ------------------------------
          // Survey popup
          // ------------------------------

          onEachFeature:
            function(feature, layer) {

              var p =
                feature.properties || {};

              var popup =
                '<div style="font-family:Arial;">' +

                '<h3 style="margin:0 0 8px 0;">' +

                (p.name || 'Survey Location') +

                '</h3>' +

                '<b>Traffic Survey Location</b>' +
                '<br><br>';


              // Towards City

              if (
                p.total_vehicles_day_towards_city
              ) {

                popup +=

                  '<b>Towards City</b><br>' +

                  'Total Vehicles/day: ' +

                  Number(
                    p.total_vehicles_day_towards_city
                  ).toLocaleString() +

                  '<br>' +

                  'Flyover Vehicles/day: ' +

                  Number(
                    p.flyover_vehicles_day_towards_city
                  ).toLocaleString() +

                  '<br>' +

                  'At-Grade Vehicles/day: ' +

                  Number(
                    p.at_grade_vehicles_day_towards_city
                  ).toLocaleString() +

                  '<br><br>';

              }


              // Towards Goldwins

              if (
                p.total_vehicles_day_towards_goldwins
              ) {

                popup +=

                  '<b>Towards Goldwins</b><br>' +

                  'Total Vehicles/day: ' +

                  Number(
                    p.total_vehicles_day_towards_goldwins
                  ).toLocaleString() +

                  '<br>' +

                  'Flyover Vehicles/day: ' +

                  Number(
                    p.flyover_vehicles_day_towards_goldwins
                  ).toLocaleString() +

                  '<br>' +

                  'At-Grade Vehicles/day: ' +

                  Number(
                    p.at_grade_vehicles_day_towards_goldwins
                  ).toLocaleString() +

                  '<br><br>';

              }


              popup +=
                '</div>';

              layer.bindPopup(popup);


              // Permanent location label

              layer.bindTooltip(
                p.name || 'Survey Location',
                {
                  permanent: true,
                  direction: 'top',
                  offset: [0, -10]
                }
              );

            }

        }
      ).addTo(map);

    })

    .catch(function(error) {

      console.error(
        'Survey location loading error:',
        error
      );

    });


  // ==========================================
  // 5. LEGEND
  // ==========================================

  var legend =
    L.control({
      position: 'bottomright'
    });


  legend.onAdd =
    function(map) {

      var div =
        L.DomUtil.create(
          'div',
          'legend'
        );


      div.innerHTML +=
        '<b>Spatial Layers</b><br>';


      div.innerHTML +=
        '<i class="line" ' +
        'style="background:#FF0000">' +
        '</i>' +
        ' G.D. Naidu Flyover<br>';


      div.innerHTML +=
        '<i style="background:#FF6600;' +
        'border:1px solid #000">' +
        '</i>' +
        ' Traffic Survey Location<br>';


      return div;

    };


  legend.addTo(map);

</script>

</body>
</html>

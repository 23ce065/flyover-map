<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>G.D. Naidu Flyover Spatial Mapping</title>

  <link rel="stylesheet" href="leaflet.css">

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
      background: #e5e3df;
    }

    /* =========================
       LEGEND
       ========================= */

    .legend {
      background: white;
      padding: 12px 14px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 22px;
      color: #222;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.25);
      border-radius: 6px;
      min-width: 190px;
    }

    .legend-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      margin: 4px 0;
    }

    .legend-line-red {
      width: 28px;
      height: 5px;
      background: #ff0000;
      margin-right: 8px;
      border-radius: 2px;
      display: inline-block;
    }

    .legend-circle-orange {
      width: 14px;
      height: 14px;
      background: #ff6600;
      border: 2px solid white;
      box-shadow: 0 0 0 1px #555;
      border-radius: 50%;
      margin-right: 8px;
      display: inline-block;
    }

    /* =========================
       SURVEY LABELS
       ========================= */

    .survey-label {
      background: white;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 3px 6px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      color: #222;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }

    .survey-label::before {
      display: none;
    }

  </style>

</head>

<body>

<div id="map"></div>

<script src="leaflet.js"></script>

<script>

  /* =====================================================
     1. INITIALIZE MAP
     ===================================================== */

  var map = L.map("map").setView(
    [11.0208, 76.9934],
    13
  );


  /* =====================================================
     2. OPEN STREET MAP
     ===================================================== */

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  /* =====================================================
     3. CREATE LAYERS
     ===================================================== */

  var flyoverLayer = null;
  var surveyLayer = null;


  /* =====================================================
     4. LOAD G.D. NAIDU FLYOVER
     ===================================================== */

  fetch("gd_naidu_flyover.geojson")

    .then(function(response) {

      if (!response.ok) {
        throw new Error(
          "Could not load gd_naidu_flyover.geojson"
        );
      }

      return response.json();

    })

    .then(function(flyoverData) {

      console.log(
        "Flyover GeoJSON loaded successfully"
      );

      flyoverLayer = L.geoJSON(
        flyoverData,
        {

          style: function(feature) {

            return {
              color: "#FF0000",
              weight: 8,
              opacity: 1
            };

          },

          onEachFeature: function(feature, layer) {

            layer.bindPopup(

              "<div style='font-family:Arial;'>" +

              "<h3 style='margin:0 0 8px 0;'>" +
              "G.D. Naidu Flyover" +
              "</h3>" +

              "<b>Study Corridor:</b><br>" +
              "Goldwins → Nava India → Uppilipalayam" +

              "</div>"

            );

          }

        }

      ).addTo(map);

    })

    .catch(function(error) {

      console.error(
        "Flyover loading error:",
        error
      );

    });


  /* =====================================================
     5. LOAD SURVEY LOCATIONS
     ===================================================== */

  fetch("survey_locations.geojson")

    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          "Could not load survey_locations.geojson"
        );

      }

      return response.json();

    })

    .then(function(surveyData) {

      console.log(
        "Survey GeoJSON loaded successfully"
      );

      surveyLayer = L.geoJSON(
        surveyData,
        {

          /* =================================================
             SURVEY POINT SYMBOL
             ================================================= */

          pointToLayer: function(feature, latlng) {

            var p =
              feature.properties || {};

            var cityTraffic =
              Number(
                p.total_vehicles_day_towards_city || 0
              );

            var goldwinsTraffic =
              Number(
                p.total_vehicles_day_towards_goldwins || 0
              );

            var totalTraffic =
              cityTraffic +
              goldwinsTraffic;

            var radius = 9;

            if (totalTraffic >= 120000) {
              radius = 17;
            }

            else if (totalTraffic >= 80000) {
              radius = 14;
            }

            else if (totalTraffic >= 50000) {
              radius = 11;
            }

            return L.circleMarker(
              latlng,
              {

                radius: radius,

                fillColor: "#FF6600",

                color: "#FFFFFF",

                weight: 3,

                opacity: 1,

                fillOpacity: 0.95

              }
            );

          },


          /* =================================================
             POPUP + LABEL
             ================================================= */

          onEachFeature: function(feature, layer) {

            var p =
              feature.properties || {};

            var popup =

              "<div style='font-family:Arial;'>" +

              "<h3 style='margin:0 0 8px 0;'>" +

              (p.name || "Survey Location") +

              "</h3>" +

              "<b>Traffic Survey Location</b>" +

              "<br><br>";


            /* TOWARDS CITY */

            if (
              p.total_vehicles_day_towards_city !== undefined
            ) {

              popup +=

                "<b>Towards City</b><br>" +

                "Total Vehicles/day: " +

                Number(
                  p.total_vehicles_day_towards_city
                ).toLocaleString() +

                "<br>" +

                "Flyover Vehicles/day: " +

                Number(
                  p.flyover_vehicles_day_towards_city || 0
                ).toLocaleString() +

                "<br>" +

                "At-Grade Vehicles/day: " +

                Number(
                  p.at_grade_vehicles_day_towards_city || 0
                ).toLocaleString() +

                "<br><br>";

            }


            /* TOWARDS GOLDWINS */

            if (
              p.total_vehicles_day_towards_goldwins !== undefined
            ) {

              popup +=

                "<b>Towards Goldwins</b><br>" +

                "Total Vehicles/day: " +

                Number(
                  p.total_vehicles_day_towards_goldwins
                ).toLocaleString() +

                "<br>" +

                "Flyover Vehicles/day: " +

                Number(
                  p.flyover_vehicles_day_towards_goldwins || 0
                ).toLocaleString() +

                "<br>" +

                "At-Grade Vehicles/day: " +

                Number(
                  p.at_grade_vehicles_day_towards_goldwins || 0
                ).toLocaleString() +

                "<br><br>";

            }


            popup += "</div>";

            layer.bindPopup(popup);


            /* PERMANENT LOCATION NAME */

            layer.bindTooltip(

              p.name || "Survey Location",

              {

                permanent: true,

                direction: "top",

                offset: [0, -12],

                className: "survey-label"

              }

            );

          }

        }

      ).addTo(map);


      /* =================================================
         KEEP MAP CENTERED ON STUDY AREA
         ================================================= */

      map.setView(
        [11.0208, 76.9934],
        13
      );

    })

    .catch(function(error) {

      console.error(
        "Survey loading error:",
        error
      );

    });


  /* =====================================================
     6. LEGEND
     ===================================================== */

  var legend =
    L.control({
      position: "bottomright"
    });


  legend.onAdd =
    function(map) {

      var div =
        L.DomUtil.create(
          "div",
          "legend"
        );

      div.innerHTML =

        "<div class='legend-title'>" +
        "G.D. Naidu Flyover Study Map" +
        "</div>" +

        "<div class='legend-row'>" +

        "<span class='legend-line-red'></span>" +

        "<span>G.D. Naidu Flyover</span>" +

        "</div>" +

        "<div class='legend-row'>" +

        "<span class='legend-circle-orange'></span>" +

        "<span>Traffic Survey Location</span>" +

        "</div>";

      return div;

    };


  legend.addTo(map);


  /* =====================================================
     7. MAP SIZE
     ===================================================== */

  setTimeout(function() {

    map.invalidateSize();

  }, 500);


  console.log(
    "G.D. Naidu Flyover Spatial Map initialized."
  );

</script>

</body>

</html>

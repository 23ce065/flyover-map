<!DOCTYPE html>
<html>
<head>
  <title>G.D. Naidu Flyover Spatial Mapping</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Local Leaflet Stylesheet -->
  <link rel="stylesheet" href="leaflet.css" />
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
    }
    #map { 
      height: 100vh; 
      width: 100%; 
      background: #e5e3df; 
    }
    .legend {
      background: white;
      padding: 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      border-radius: 5px;
    }
    .legend i {
      width: 14px;
      height: 14px;
      float: left;
      margin-right: 8px;
      border-radius: 50%;
    }
    .legend .line {
      height: 4px;
      border-radius: 0;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Local Script Dependencies -->
<script src="leaflet.js"></script>
<script src="data.js"></script>

<script>
  // 1. Initialize Map view over Coimbatore corridor
  var map = L.map('map').setView([11.0045, 76.9616], 14);

  // 2. OpenStreetMap Tile Layer
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

// 3. Load ONLY the G.D. Naidu Flyover
fetch('gd_naidu_flyover.geojson')
  .then(response => response.json())
  .then(flyoverData => {

    var flyoverLayer = L.geoJSON(flyoverData, {

      style: {
        color: "#FF0000",
        weight: 7,
        opacity: 0.95
      },

      onEachFeature: function(feature, layer) {
        layer.bindPopup(
          "<b>G.D. Naidu Flyover</b><br>" +
          "Goldwins – Uppilipalayam"
        );
      }

    }).addTo(map);

    // Zoom to the flyover
    if (flyoverLayer.getBounds().isValid()) {
      map.fitBounds(flyoverLayer.getBounds(), {
        padding: [30, 30]
      });
    }

  })
  .catch(error => {
    console.error(
      "Error loading G.D. Naidu Flyover GeoJSON:",
      error
    );
  });


// 4. Load Survey Locations
fetch('survey_locations.geojson')
  .then(response => response.json())
  .then(surveyData => {

    var surveyLayer = L.geoJSON(surveyData, {

      pointToLayer: function(feature, latlng) {

        var p = feature.properties || {};

        var totalCity =
          Number(p.total_vehicles_day_towards_city || 0);

        var totalGoldwins =
          Number(p.total_vehicles_day_towards_goldwins || 0);

        var totalTraffic =
          totalCity + totalGoldwins;

        var radius = 9;

        if (totalTraffic >= 120000) {
          radius = 16;
        } else if (totalTraffic >= 80000) {
          radius = 13;
        } else if (totalTraffic >= 50000) {
          radius = 10;
        }

        return L.circleMarker(latlng, {
          radius: radius,
          fillColor: "#FF6600",
          color: "#FFFFFF",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        });
      },

      onEachFeature: function(feature, layer) {

        var p = feature.properties || {};

        var popup =
          "<div style='font-family:Arial;'>" +
          "<h3 style='margin:0 0 8px 0;'>" +
          p.name +
          "</h3>" +
          "<b>Traffic Survey Location</b><br><br>";

        if (p.total_vehicles_day_towards_city) {

          popup +=
            "<b>Towards City</b><br>" +
            "Total Vehicles/day: " +
            Number(
              p.total_vehicles_day_towards_city
            ).toLocaleString() +
            "<br>" +

            "Flyover Vehicles/day: " +
            Number(
              p.flyover_vehicles_day_towards_city
            ).toLocaleString() +
            "<br>" +

            "At-Grade Vehicles/day: " +
            Number(
              p.at_grade_vehicles_day_towards_city
            ).toLocaleString() +
            "<br><br>";
        }

        if (p.total_vehicles_day_towards_goldwins) {

          popup +=
            "<b>Towards Goldwins</b><br>" +
            "Total Vehicles/day: " +
            Number(
              p.total_vehicles_day_towards_goldwins
            ).toLocaleString() +
            "<br>" +

            "Flyover Vehicles/day: " +
            Number(
              p.flyover_vehicles_day_towards_goldwins
            ).toLocaleString() +
            "<br>" +

            "At-Grade Vehicles/day: " +
            Number(
              p.at_grade_vehicles_day_towards_goldwins
            ).toLocaleString() +
            "<br><br>";
        }

        popup += "</div>";

        layer.bindPopup(popup);

        // Location label
        layer.bindTooltip(
          p.name,
          {
            permanent: true,
            direction: "top",
            offset: [0, -10]
          }
        );
      }

    }).addTo(map);

  })
  .catch(error => {
    console.error(
      "Error loading survey locations:",
      error
    );
  });
// 4A. Load survey locations from GeoJSON
fetch('survey_locations.geojson')
  .then(response => response.json())
  .then(surveyData => {

    var surveyLayer = L.geoJSON(surveyData, {

      pointToLayer: function(feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 9,
          fillColor: "#FF6600",
          color: "#FFFFFF",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        });
      },

      onEachFeature: function(feature, layer) {

        var p = feature.properties;

        var popup = "<div style='font-family:Arial;'>" +
          "<h3 style='margin:0 0 8px 0;'>" + p.name + "</h3>" +
          "<b>Survey Location</b><br><br>";

        if (p.total_vehicles_day_towards_city) {
          popup +=
            "<b>Towards City</b><br>" +
            "Total Vehicles/day: " +
            Number(p.total_vehicles_day_towards_city).toLocaleString() + "<br>" +
            "Flyover Vehicles/day: " +
            Number(p.flyover_vehicles_day_towards_city).toLocaleString() + "<br>" +
            "At-Grade Vehicles/day: " +
            Number(p.at_grade_vehicles_day_towards_city).toLocaleString() +
            "<br><br>";
        }

        if (p.total_vehicles_day_towards_goldwins) {
          popup +=
            "<b>Towards Goldwins</b><br>" +
            "Total Vehicles/day: " +
            Number(p.total_vehicles_day_towards_goldwins).toLocaleString() + "<br>" +
            "Flyover Vehicles/day: " +
            Number(p.flyover_vehicles_day_towards_goldwins).toLocaleString() + "<br>" +
            "At-Grade Vehicles/day: " +
            Number(p.at_grade_vehicles_day_towards_goldwins).toLocaleString() +
            "<br><br>";
        }

        popup += "<b>Location:</b> " + p.name;

        popup += "</div>";

        layer.bindPopup(popup);
      }

    }).addTo(map);

    // Add labels for the three survey locations
    surveyLayer.eachLayer(function(layer) {

      var name = layer.feature.properties.name;

      layer.bindTooltip(name, {
        permanent: true,
        direction: 'top',
        offset: [0, -10]
      });

    });

  })
  .catch(error => {
    console.error("Error loading survey GeoJSON:", error);
  });

  // 5. Automatically focus camera bounds on vector data
  if (geojsonLayer.getBounds().isValid()) {
    map.fitBounds(geojsonLayer.getBounds());
  }

  // 6. Map Legend
  var legend = L.control({position: 'bottomright'});
  legend.onAdd = function (map) {
    var div = L.DomUtil.create('div', 'legend');
    div.innerHTML += '<b>Spatial Layers</b><br>';
    div.innerHTML += '<i class="line" style="background: #FF0000"></i> Elevated Flyover Deck<br>';
    div.innerHTML += '<i class="line" style="background: #0078FF"></i> Surface Roads & U-Turns<br>';
    div.innerHTML += '<i style="background: #FFD700; border: 1px solid #000"></i> Junctions & Signals<br>';
    return div;
  };
  legend.addTo(map);
</script>

</body>
</html>

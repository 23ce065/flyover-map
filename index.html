<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G.D. Naidu Flyover Study Map</title>

<link rel="stylesheet" href="leaflet.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
    background: #e5e3df;
}

/* ================================
   LEGEND
   ================================ */

.legend {
    background: white;
    padding: 12px 14px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 22px;
    color: #222;
    box-shadow: 0 0 15px rgba(0,0,0,0.25);
    border-radius: 6px;
    min-width: 210px;
}

.legend-title {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

.legend-row {
    display: flex;
    align-items: center;
    margin: 5px 0;
}

.red-line {
    width: 30px;
    height: 5px;
    background: #ff0000;
    margin-right: 8px;
    border-radius: 2px;
}

.orange-circle {
    width: 14px;
    height: 14px;
    background: #ff6600;
    border: 2px solid white;
    box-shadow: 0 0 0 1px #555;
    border-radius: 50%;
    margin-right: 8px;
}

/* ================================
   SURVEY LABEL
   ================================ */

.survey-label {
    background: white;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 3px 6px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    color: #222;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.survey-label::before {
    display: none;
}

/* ================================
   SIGNAL MARKER
   ================================ */

.signal-marker {
    width: 30px;
    height: 30px;
    background: #d71920;
    border: 3px solid white;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: bold;

    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

/* ================================
   U-TURN MARKER
   ================================ */

.uturn-marker {
    width: 30px;
    height: 30px;
    background: #1565c0;
    border: 3px solid white;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;

    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

</style>

</head>

        {

            fillColor: "#ff6600",
            color: "#ffffff",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.95
        }
    ).addTo(map);

        location.name,
        {
            permanent: true,
            direction: "top",
            offset: [0, -12],
            className: "survey-label"
        }
    );

        [signal.lat, signal.lng],
        {

   12. FIT MAP TO STUDY AREA
   ========================================================= */

/* Flyover */

flyoverCoordinates.forEach(function(point) {

    allPoints.push(point);

});


/* Survey locations */

surveyLocations.forEach(function(location) {

    allPoints.push([
        location.lat,
        location.lng
    ]);

});


/* Signals */

trafficSignals.forEach(function(signal) {

    allPoints.push([
        signal.lat,
        signal.lng
    ]);

});


/* U-turns */

uTurnLocations.forEach(function(uTurn) {

    allPoints.push([
        uTurn.lat,
        uTurn.lng
    ]);

});


map.fitBounds(
    L.latLngBounds(allPoints),
    {
        padding: [50, 50]
    }
);

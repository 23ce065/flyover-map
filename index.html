<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G.D. Naidu Flyover Study Map</title>

<link rel="stylesheet" href="leaflet.css">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

#map {
    width: 100%;
    height: 100vh;
    background: #e5e3df;
}

.legend {
    background: white;
    padding: 12px 14px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 22px;
    color: #222;
    box-shadow: 0 0 15px rgba(0,0,0,0.25);
    border-radius: 6px;
    min-width: 200px;
}

.legend-title {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

.legend-row {
    display: flex;
    align-items: center;
    margin: 5px 0;
}

.red-line {
    width: 30px;
    height: 5px;
    background: red;
    margin-right: 8px;
}

.orange-circle {
    width: 14px;
    height: 14px;
    background: #ff6600;
    border: 2px solid white;
    box-shadow: 0 0 0 1px #555;
    border-radius: 50%;
    margin-right: 8px;
}

.survey-label {
    background: white;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 3px 6px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    color: #222;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

.survey-label::before {
    display: none;
}

</style>
</head>

<body>

<div id="map"></div>

<script src="leaflet.js"></script>

/* =========================================================
   1. CREATE MAP
   ========================================================= */

var map = L.map("map");


/* =========================================================
   2. OPEN STREET MAP
   ========================================================= */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

/* =========================================================
   4. DRAW RED FLYOVER LINE
   ========================================================= */

var flyover = L.polyline(
    flyoverCoordinates,
    {
        color: "#FF0000",
        weight: 8,
        opacity: 1,
        lineJoin: "round",
        lineCap: "round"
    }
).addTo(map);


/* =========================================================
   5. FLYOVER POPUP
   ========================================================= */

flyover.bindPopup(
    "<b>G.D. Naidu Flyover</b><br><br>" +
    "Avinashi Road Corridor<br>" +
    "Goldwins → Nava India → Uppilipalayam"
);


/* =========================================================
   6. SURVEY LOCATIONS
   =========================================================
   
   Your three coordinates converted from
   DMS to decimal degrees:
   
   1. 11°02'35.6\"N 77°02'42.3\"E
      = 11.043222, 77.045083
   
   2. 11°01'14.9\"N 76°59'36.2\"E
      = 11.020806, 76.993389
   
   3. 11°00'10.3\"N 76°58'11.0\"E
      = 11.002861, 76.969722
   ========================================================= */

var surveyLocations = [

    {
        name: "Goldwins",
        lat: 11.043222,
        lng: 77.045083
    },

    {
        name: "Nava India",
        lat: 11.020806,
        lng: 76.993389
    },

    {
        name: "Uppilipalayam",
        lat: 11.002861,
        lng: 76.969722
    }

];


/* =========================================================
   7. ADD SURVEY POINTS
   ========================================================= */

surveyLocations.forEach(function(location) {

    var marker = L.circleMarker(
        [location.lat, location.lng],
        {
            radius: 9,
            fillColor: "#FF6600",
            color: "#FFFFFF",
            weight: 3,
            opacity: 1,
            fillOpacity: 0.95
        }
    ).addTo(map);


    marker.bindTooltip(
        location.name,
        {
            permanent: true,
            direction: "top",
            offset: [0, -12],
            className: "survey-label"
        }
    );


    marker.bindPopup(
        "<b>" + location.name + "</b><br><br>" +
        "Traffic Survey Location<br>" +
        "Latitude: " + location.lat + "<br>" +
        "Longitude: " + location.lng
    );

});


/* =========================================================
   8. CREATE ONE COMMON BOUNDARY
   =========================================================
   
   This is important.
   
   The map will now automatically show BOTH:
   - the red flyover
   - all 3 survey locations
   
   together.
   ========================================================= */

var allPoints = [];


/* Add flyover points */

flyoverCoordinates.forEach(function(point) {

    allPoints.push(point);

});


/* Add survey points */

surveyLocations.forEach(function(location) {

    allPoints.push(
        [location.lat, location.lng]
    );

});


/* Fit entire study area */

map.fitBounds(
    L.latLngBounds(allPoints),
    {
        padding: [50, 50]
    }
);


/* =========================================================
   9. LEGEND
   ========================================================= */

var legend = L.control({
    position: "bottomright"
});


legend.onAdd = function() {

    var div = L.DomUtil.create(
        "div",
        "legend"
    );


    div.innerHTML =

        "<div class='legend-title'>" +
        "G.D. Naidu Flyover Study Map" +
        "</div>" +

        "<div class='legend-row'>" +
        "<span class='red-line'></span>" +
        "<span>G.D. Naidu Flyover</span>" +
        "</div>" +

        "<div class='legend-row'>" +
        "<span class='orange-circle'></span>" +
        "<span>Traffic Survey Location</span>" +
        "</div>";


    return div;

};


legend.addTo(map);


/* =========================================================
   10. MAP SIZE FIX
   ========================================================= */

setTimeout(function() {

    map.invalidateSize();

}, 500);


/* =========================================================
   11. CONSOLE MESSAGE
   ========================================================= */

console.log(
